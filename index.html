
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ترتيلاً لإدارة الحلقات والاشتراكات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --pink-bg: #fff0f5; 
            --blue-accent: #e0f7fa; 
            --pink-main: #ff69b4;
            --pistachio: #e8f5e9; 
            --white-card: #ffffff;
            --text-color: #4a4a4a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--pink-bg); font-family: 'Cairo', sans-serif; color: var(--text-color); padding: 30px 15px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { background: var(--white-card); max-width: 650px; width: 100%; border-radius: 25px; box-shadow: 0 10px 30px rgba(255, 105, 180, 0.1); padding: 30px; border: 2px solid #ffb6c1; }
        
        .header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px dashed #ffb6c1; }
        .platform-name { color: var(--pink-main); font-size: 34px; font-weight: 700; }
        .teacher-name { color: #777; font-size: 16px; display: block; margin-top: 5px; font-weight: 600; }
        
        .tabs-menu { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #f5f5f5; border-radius: 12px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 14px; color: #777; transition: all 0.3s; }
        .tab-btn.active { background: var(--pink-main); color: white; box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--pink-main); }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 15px; background-color: #fafafa; outline: none; transition: all 0.3s; font-family: 'Cairo', sans-serif; }
        input:focus, select:focus, textarea:focus { border-color: var(--pink-main); background-color: #fff; }
        
        .status-box { display: flex; gap: 15px; }
        .status-option { flex: 1; text-align: center; }
        .status-option input { display: none; }
        .status-option label { background: #f5f5f5; padding: 12px; border-radius: 12px; cursor: pointer; border: 2px solid #e0e0e0; display: block; font-weight: 700; transition: all 0.3s; }
        .status-option input:checked + label { background: var(--pink-main); color: white; border-color: var(--pink-main); }
        
        .eval-card { background: #fffafb; padding: 20px; border-radius: 15px; border: 1px solid #ffb6c1; margin-top: 15px; }
        .money-card { background: #fffde7; padding: 15px; border-radius: 12px; border: 1px solid #fff59d; margin-bottom: 15px; }
        
        .submit-btn { width: 100%; background: var(--pink-main); color: white; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 10px; transition: all 0.3s; box-shadow: 0 4px 12px rgba(255, 105, 180, 0.2); }
        .submit-btn:hover { background: #ff4500; }
        
        .alert { display: none; padding: 15px; border-radius: 12px; text-align: center; margin-top: 20px; font-weight: bold; background: var(--pistachio); color: #2e7d32; border: 1px solid #c8e6c9; }
        .counter-info { background: var(--blue-accent); padding: 10px; border-radius: 10px; text-align: center; font-size: 14px; margin-top: 8px; color: #006064; font-weight: 600; display: none; }
        .points-badge { background: #fff3e0; color: #e65100; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-right: 5px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="platform-name">منصة ترتيلاً الإلكترونية</h1>
        <span class="teacher-name">تحت إشراف المعلمة بسنت أحمد</span>
    </div>

    <div class="tabs-menu">
        <button class="tab-btn active" onclick="switchTab('halka-tab')"><i class="fa-solid fa-pen-to-square"></i> رصد الحلقة</button>
        <button class="tab-btn" onclick="switchTab('students-tab')"><i class="fa-solid fa-user-plus"></i> الطلاب والمواعيد</button>
    </div>

    <!-- التبويب الأول: رصد الحلقة والمتابعة المالية والاشتراكات -->
    <div id="halka-tab" class="tab-content active">
        <form id="tartilaForm">
            <div class="form-group">
                <label><i class="fa-regular fa-calendar-days"></i> التاريخ اليومي الحالي:</label>
                <input type="date" id="halkaDate" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-user-graduate"></i> اسم الطالب:</label>
                <select id="studentSelect" required onchange="updateStudentStats()">
                    <option value="" disabled selected>-- اختر اسم الطالب الحالي --</option>
                    <option value="محمد ماجد">محمد ماجد</option>
                    <option value="محمد على">محمد على</option>
                    <option value="يارا">يارا</option>
                    <option value="ادم">ادم</option>
                    <option value="فريده">فريده</option>
                    <option value="عمر">عمر</option>
                    <option value="لين">لين</option>
                    <option value="رقيه">رقيه</option>
                    <option value="منصور">منصور</option>
                    <option value="مؤيد">مؤيد</option>
                    <option value="جومانا">جومانا</option>
                    <option value="جيدا">جيدا</option>
                    <option value="أروى">أروى</option>
                    <option value="أسمى">أسمى</option>
                    <option value="يوسف">يوسف</option>
                    <option value="مريم">مريم</option>
                    <option value="زياد">زياد</option>
                    <option value="ريان">ريان</option>
                    <option value="مالك">مالك</option>
                    <option value="حمزه">حمزه</option>
                    <option value="حلا ماجد">حلا ماجد</option>
                    <option value="بسمله">بسمله</option>
                    <option value="أدم حسين">أدم حسين</option>
                    <option value="طالب جديد">➕ [إضافة طالب جديد يدوياً]</option>
                </select>
                
                <input type="text" id="customStudentName" placeholder="اكتبي اسم الطالب الجديد هنا..." style="display:none; margin-top:10px; border-color:#ff69b4;">
                <div id="counterInfo" class="counter-info"></div>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-circle-info"></i> الحالة:</label>
                <div class="status-box">
                    <div class="status-option">
                        <input type="radio" name="st" id="p" value="حضور" checked onclick="showEval(true)">
                        <label for="p">حضور ✅</label>
                    </div>
                    <div class="status-option">
                        <input type="radio" name="st" id="a" value="غياب" onclick="showEval(false)">
                        <label for="a">غياب ❌</label>
                    </div>
                </div>
            </div>

            <div id="evalArea" class="eval-card">
                
                <!-- قسم الحسابات والاشتراكات المطور -->
                <div class="money-card">
                    <h4 style="color: #e65100; margin-bottom: 10px;"><i class="fa-solid fa-wallet"></i> الحصر المالي للاشتراك:</h4>
                    <div class="form-group">
                        <label style="color: #555; font-size: 14px;">حالة الاشتراك:</label>
                        <select id="subscriptionSelect" onchange="toggleMoneyFields()">
                            <option value="مدفوع 🟢" selected>مدفوع 🟢</option>
                            <option value="غير مدفوع 🔴">غير مدفوع 🔴</option>
                        </select>
                    </div>
                    
                    <div id="moneyFields" style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <label style="color: #555; font-size: 14px;">كم دفع الطالب؟ (المبلغ):</label>
                            <input type="number" id="amountPaid" placeholder="مثال: 200" value="0">
                        </div>
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <label style="color: #555; font-size: 14px;">يوم كام؟ (تاريخ الدفع):</label>
                            <input type="date" id="paymentDate">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-medal"></i> منح نقاط تميز إضافية لحلقة اليوم:</label>
                    <select id="pointsSelect">
                        <option value="0">بدون نقاط إضافية</option>
                        <option value="5">5 نقاط (حفظ ممتاز) ⭐</option>
                        <option value="10">10 نقاط (أداء استثنائي وتجويد متقن) 🏆</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📖 مستوى الحفظ اليومي:</label>
                    <input type="text" id="hifzLevel" placeholder="اكتبي السورة والآيات...">
                </div>

                <div class="form-group">
                    <label>🔄 مستوى المراجعة الحالية:</label>
                    <input type="text" id="moraajaaLevel" placeholder="اكتبي السورة أو الأجزاء...">
                </div>

                <div class="form-group">
                    <label>✨ جودة التجويد والأداء:</label>
                    <input type="text" id="tajweedQuality" placeholder="مثال: تجويد سليم وممتاز">
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label>🔍 بيان القصور أو ملاحظات التوجيه الكلي لولي الأمر:</label>
                    <textarea id="deficiencyNotes" rows="2" placeholder="اكتبي القصور أو التوجيه هنا..."></textarea>
                </div>
            </div>

            <button type="submit" class="submit-btn">حفظ وإرسال التقرير والحسابات</button>
        </form>
    </div>

    <!-- التبويب الثاني: إدخال بيانات المواعيد -->
    <div id="students-tab" class="tab-content">
        <form id="newStudentForm">
            <div class="form-group">
                <label><i class="fa-solid fa-id-card"></i> اسم الطفل بالكامل:</label>
                <input type="text" id="newStudentName" placeholder="مثال: إبراهيم محمد" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-child"></i> عمر الطفل:</label>
                <input type="number" id="studentAge" placeholder="مثال: 7 سنوات" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-clock"></i> الموعد الأسبوعي المحدد له:</label>
                <input type="text" id="studentSchedule" placeholder="مثال: السبت الساعة 4 عصراً" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> رقم تواصل ولي الأمر (واتساب):</label>
                <input type="tel" id="studentPhone" placeholder="مثال: 010XXXXXXXX" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-rotate"></i> نوع ومسار الحصة المعتمدة الحالية:</label>
                <select id="classType">
                    <option value="أساسية منتظمة" selected>حصة أساسية منتظمة بموعدها</option>
                    <option value="تعويضية عن غياب سابق">حصة تعويضية إضافية (بدل غياب سابق)</option>
                </select>
            </div>
            <button type="submit" class="submit-btn" style="background-color: #20b2aa;">حفظ وإضافة الطالب والموعد للجدول</button>
        </form>
    </div>

    <div id="msg" class="alert">تمت العملية وتحديث السجلات بنجاح! ✨</div>
</div>

<script>
    // الرابط المباشر والأحدث المربوط بالـ Script الحالي الخاص بكِ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMxNUqNvq7heRSi3FSOP_nnTvezB_QzurGK04KNHz96EqxoKl3wS4qJMZmkM5wnfqv/exec";

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('halkaDate').value = today;
    document.getElementById('paymentDate').value = today;

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function showEval(v) { 
        document.getElementById('evalArea').style.display = v ? 'block' : 'none'; 
    }

    function toggleMoneyFields() {
        const sub = document.getElementById('subscriptionSelect').value;
        const moneyFields = document.getElementById('moneyFields');
        if (sub === "غير مدفوع 🔴") {
            moneyFields.style.display = 'none';
            document.getElementById('amountPaid').value = "0";
        } else {
            moneyFields.style.display = 'flex';
        }
    }

    function updateStudentStats() {
        const select = document.getElementById('studentSelect');
        const customInput = document.getElementById('customStudentName');
        const student = select.value;
        
        if (student === "طالب جديد") {
            customInput.style.display = 'block';
            customInput.setAttribute('required', 'true');
            document.getElementById('counterInfo').style.display = 'none';
            return;
        } else {
            customInput.style.display = 'none';
            customInput.removeAttribute('required');
        }

        if (!student) return;
        
        let lessons = parseInt(localStorage.getItem('lessons_' + student)) || 0;
        let points = parseInt(localStorage.getItem('points_' + student)) || 0;
        
        const counterInfo = document.getElementById('counterInfo');
        counterInfo.style.display = 'block';
        counterInfo.innerHTML = `<i class="fa-solid fa-list-check"></i> الحصص المحسوبة: <b>${lessons}/8</b> حصص | <i class="fa-solid fa-trophy"></i> نقاط التميز: <span class="points-badge">${points} نقطة</span>`;
    }

    document.getElementById('tartilaForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const msg = document.getElementById('msg');
        const select = document.getElementById('studentSelect');
        let student = select.value;
        
        if (student === "طالب جديد") {
            student = document.getElementById('customStudentName').value.trim();
        }

        const status = document.querySelector('input[name="st"]:checked').value;
        
        msg.style.display = 'block';
        msg.innerText = "جاري حفظ التقرير والبيانات المالية الحالية... ⏳";

        let hifz = "-", moraajaa = "-", tajweed = "-", deficiency = "-", subscription = "-", addedPoints = 0;
        let amountPaid = 0, paymentDate = "-";

        if(status === "حضور") {
            hifz = document.getElementById('hifzLevel').value || "لم يحدد";
            moraajaa = document.getElementById('moraajaaLevel').value || "لم يحدد";
            tajweed = document.getElementById('tajweedQuality').value || "لم يحدد";
            deficiency = document.getElementById('deficiencyNotes').value || "لا يوجد قصور";
            subscription = document.getElementById('subscriptionSelect').value;
            addedPoints = parseInt(document.getElementById('pointsSelect').value) || 0;
            
            if (subscription === "مدفوع 🟢") {
                amountPaid = document.getElementById('amountPaid').value || 0;
                paymentDate = document.getElementById('paymentDate').value || today;
            }

            let currentLessons = parseInt(localStorage.getItem('lessons_' + student)) || 0;
            let currentPoints = parseInt(localStorage.getItem('points_' + student)) || 0;
            
            currentLessons++;
            currentPoints += addedPoints;
            
            localStorage.setItem('lessons_' + student, currentLessons);
            localStorage.setItem('points_' + student, currentPoints);

            if (currentLessons >= 8) {
                alert(`🚨 إنذار مالي للمعلمة بسنت:\n\nالطالب [ ${student} ] أتم اليوم حصته الـ 8! انتهى الشهر المالي وجاهز للتجديد.`);
                localStorage.setItem('lessons_' + student, 0); 
            }
            
            if (currentPoints >= 50) {
                alert(`🏆 بطاقة تميز واحتفال للطفل:\n\nالطالب [ ${student} ] جمع 50 نقطة تميز! جاهز لاستلام شهادة الإنجاز الشهري.`);
            }
        } else {
            deficiency = "غائب عن الحلقة";
            subscription = "غائب ❌";
        }

        const payload = {
            type: "halka_report",
            date: document.getElementById('halkaDate').value,
            name: student,
            status: status,
            hifz: hifz,
            moraajaa: moraajaa,
            tajweed: tajweed,
            deficiency: deficiency,
            subscription: subscription,
            points: addedPoints,
            amountPaid: amountPaid,    
            paymentDate: paymentDate   
        };

        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
        .then(() => {
            msg.innerText = "تم حفظ حصر الدفع والتقرير في خلايا شيت وجدول الحلقات بنجاح! 🌸✨";
            document.getElementById('hifzLevel').value = "";
            document.getElementById('moraajaaLevel').value = "";
            document.getElementById('tajweedQuality').value = "";
            document.getElementById('deficiencyNotes').value = "";
            document.getElementById('customStudentName').value = "";
            document.getElementById('amountPaid').value = "0";
            select.value = "";
            document.getElementById('counterInfo').style.display = 'none';
            document.getElementById('customStudentName').style.display = 'none';
            setTimeout(() => msg.style.display='none', 4000);
        });
    });

    document.getElementById('newStudentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const msg = document.getElementById('msg');
        msg.style.display = 'block';
        msg.innerText = "جاري جدولة الموعد ونوع الحصة بالجدول... 💾";

        const payload = {
            type: "new_student",
            name: document.getElementById('newStudentName').value,
            age: document.getElementById('studentAge').value,
            schedule: document.getElementById('studentSchedule').value,
            phone: document.getElementById('studentPhone').value,
            classType: document.getElementById('classType').value
        };

        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
        .then(() => {
            msg.innerText = "تم حفظ الموعد بنجاح في ورقة 'بيانات الطلاب'! 🟢";
            
            const select = document.getElementById('studentSelect');
            const opt = document.createElement('option');
            opt.value = payload.name;
            opt.innerHTML = payload.name;
            select.insertBefore(opt, select.lastChild);

            document.getElementById('newStudentForm').reset();
            setTimeout(() => msg.style.display='none', 4000);
        });
    });
</script>

</body>
</html>
